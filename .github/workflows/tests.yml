name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t job-hunt-agent .
      - name: Panel answers and a resume exports to PDF with LibreOffice
        run: |
          docker run -d --name jha -p 127.0.0.1:8765:8765 job-hunt-agent
          for i in $(seq 1 30); do curl -sf -H "Host: 127.0.0.1:8765" http://127.0.0.1:8765/api/ping && break; sleep 1; done
          curl -sf -H "Host: 127.0.0.1:8765" http://127.0.0.1:8765/api/config | grep -q '"in_docker": true'
          curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example" http://127.0.0.1:8765/api/config | grep -q 403
          docker exec jha sh -c 'cp config.example.json config.json && python tools/tailor_resume.py --out /tmp/out' | tee out.json
          grep -q '"pdf_mb"' out.json
          docker logs jha
